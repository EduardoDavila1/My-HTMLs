<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ed's Hub | En Construcción</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg: #000000;
            --color-text: #ffffff;
            --color-accent: #4db8ff;
            --glass-bg: rgba(10, 14, 26, 0.75);
            --glass-border: 1px solid rgba(77, 184, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* --- ICONO ANIMADO --- */
        .tool-container {
            margin-bottom: 30px;
            position: relative;
        }

        .tool-icon {
            font-size: 5rem;
            color: var(--color-accent);
            animation: wrench-move 2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px var(--color-accent));
        }

        @keyframes wrench-move {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-30deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-30deg); }
            80% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- TÍTULO REACTIVO --- */
        h1#dynamic-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.1);
            position: relative;
            display: inline-block;
            user-select: none;
        }

        h1#dynamic-title::after {
            content: "EN CONSTRUCCIÓN";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: var(--color-accent);
            pointer-events: none;
            clip-path: circle(0% at 0% 0%);
            transition: clip-path 0.1s linear;
            text-shadow: 0 0 20px var(--color-accent), 0 0 40px var(--color-accent);
        }

        p.subtitle {
            color: #b0c4de;
            font-size: 1.5rem;
            letter-spacing: 3px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .back-home {
            margin-top: 50px;
            text-decoration: none;
            color: var(--color-accent);
            border: 1px solid var(--color-accent);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            background: rgba(77, 184, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .back-home:hover {
            background: var(--color-accent);
            color: black;
            box-shadow: 0 0 20px var(--color-accent);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            h1#dynamic-title { font-size: 2.5rem; letter-spacing: 4px; }
            .tool-icon { font-size: 3.5rem; }
        }
    </style>
</head>

<body>

    <div id="ui-container">
        <div class="tool-container">
            <i class="fas fa-wrench tool-icon"></i>
        </div>
        
        <h1 id="dynamic-title">EN CONSTRUCCIÓN</h1>
        
        <p class="subtitle">Módulo en proceso de optimización</p>

        <a href="https://www.edstudiosanimation.com" class="back-home">
            <i class="fas fa-home"></i> VOLVER AL HUB
        </a>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        let camera, scene, renderer, stars;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0002);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.z = 1000;
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.id = 'three-canvas';
            document.body.prepend(renderer.domElement);

            const starGeometry = new THREE.BufferGeometry();
            const starCount = 6000;
            const posArray = new Float32Array(starCount * 3);
            const colorArray = new Float32Array(starCount * 3);
            const sizeArray = new Float32Array(starCount);
            const baseColor = new THREE.Color(0x4db8ff);

            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;
                const radius = 2000 + Math.random() * 3000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                posArray[i3] = radius * Math.sin(phi) * Math.cos(theta);
                posArray[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                posArray[i3 + 2] = radius * Math.cos(phi);
                const starColor = baseColor.clone().offsetHSL(Math.random() * 0.2 - 0.1, 0, Math.random() * 0.5);
                colorArray[i3] = starColor.r;
                colorArray[i3 + 1] = starColor.g;
                colorArray[i3 + 2] = starColor.b;
                sizeArray[i] = Math.random() * 3 + 0.5;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
            starGeometry.setAttribute('size', new THREE.BufferAttribute(sizeArray, 1));

            const starMaterial = new THREE.PointsMaterial({
                size: 1,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });

            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            document.addEventListener('pointermove', (e) => {
                mouseX = e.clientX - windowHalfX;
                mouseY = e.clientY - windowHalfY;
                
                const title = document.getElementById('dynamic-title');
                if (title) {
                    const rect = title.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    title.style.webkitClipPath = `circle(120px at ${x}px ${y}px)`;
                    title.style.clipPath = `circle(120px at ${x}px ${y}px)`;
                }
            });

            window.addEventListener('resize', () => {
                windowHalfX = window.innerWidth / 2;
                windowHalfY = window.innerHeight / 2;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.00005;
            stars.rotation.y = time * 0.5;
            stars.rotation.x = time * 0.2;
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
