<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gods Within Ourselves - Sireno Music</title>
<style>
    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        background-color: #050515;
        overflow: hidden; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    
    /* Background Layer */
    #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    
    .psy-layer { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        pointer-events: none; mix-blend-mode: screen; z-index: 1; opacity: 0.6; 
    }
    
    /* Nebula Blobs with new palette */
    .blob { 
        position: absolute; border-radius: 50%; filter: blur(120px); 
        animation: float 16s infinite alternate ease-in-out; 
    }
    .blob1 { width: 50vw; height: 50vw; background: #0044FF; top: -10%; left: -10%; animation-delay: 0s; }
    .blob2 { width: 55vw; height: 55vw; background: #7F00FF; bottom: -20%; right: -10%; animation-delay: -4s; }
    .blob3 { width: 35vw; height: 35vw; background: #FF5500; top: 40%; left: 25%; opacity: 0.4; animation-delay: -8s; }
    
    @keyframes float { 
        0% { transform: translate(0, 0) scale(1) rotate(0deg); } 
        100% { transform: translate(80px, 120px) scale(1.2) rotate(90deg); } 
    }
    
    /* Fixed Title - No Parallax */
    header { 
        position: fixed; top: 40px; width: 100%; text-align: center; z-index: 10; 
        pointer-events: none;
    }
    h1 { 
        margin: 0; color: #FFFFFF; font-size: 3.5rem; text-transform: uppercase; 
        letter-spacing: 12px; font-weight: 800;
        text-shadow: 0 0 10px #00D2FF, 0 0 20px #0044FF, 0 0 40px #7F00FF; 
        animation: neonPulse 2s infinite alternate; 
    }
    h2 { 
        margin: 15px 0 0 0; color: #00D2FF; font-size: 1.5rem; font-weight: 300; 
        letter-spacing: 6px; text-transform: uppercase;
        text-shadow: 0 0 10px #7F00FF, 0 0 20px #FF5500; 
    }
    
    @keyframes neonPulse { 
        0% { text-shadow: 0 0 10px #00D2FF, 0 0 20px #0044FF, 0 0 40px #7F00FF; } 
        50% { text-shadow: 0 0 15px #00D2FF, 0 0 30px #9900FF, 0 0 50px #FF3333, 0 0 70px #0044FF; }
        100% { text-shadow: 0 0 12px #00D2FF, 0 0 25px #0044FF, 0 0 45px #7F00FF; } 
    }
    
    /* Content Layout with Subtle Parallax */
    main { 
        position: relative; z-index: 5; width: 100%; height: 100%; 
        display: flex; justify-content: center; align-items: center; 
        perspective: 1000px; 
    }
    
    .content-wrapper { 
        transition: transform 0.2s ease-out; 
        display: flex; flex-direction: column; align-items: center; 
        padding: 40px; margin-top: 60px; 
    }
    
    /* Video Frame Container - Outer Glow & Moving Light Effect */
    .video-frame-container {
        position: relative;
        padding: 6px;
        border-radius: 24px;
        overflow: hidden;
        background: #050515;
        box-shadow: 0 0 40px rgba(0, 85, 255, 0.3), 0 0 70px rgba(127, 0, 255, 0.2);
        animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    /* Moving Light Beam Laser Border */
    .video-frame-container::before {
        content: '';
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(
            transparent, 
            #0044FF 10%, 
            #00D2FF 20%, 
            #7F00FF 35%, 
            transparent 45%, 
            transparent 60%,
            #FF5500 75%,
            #FF3333 85%,
            transparent 95%
        );
        animation: rotateLaser 4s linear infinite;
        z-index: 1;
    }

    /* Inner frame mask to keep background clean behind iframe */
    .video-frame-inner {
        position: relative;
        background: #000;
        border-radius: 18px;
        z-index: 2;
        padding: 2px;
    }
    
    iframe { 
        display: block; border-radius: 16px; 
        width: 82vw; max-width: 960px; height: 46vw; max-height: 540px; border: none; 
        background-color: #000;
    }

    @keyframes rotateLaser {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
        0% { box-shadow: 0 0 30px rgba(0, 210, 255, 0.4), 0 0 50px rgba(127, 0, 255, 0.3); }
        100% { box-shadow: 0 0 50px rgba(0, 68, 255, 0.6), 0 0 90px rgba(255, 85, 0, 0.4); }
    }
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div class="psy-layer">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
</div>

<header>
    <h1>The Gods Within Ourselves</h1>
    <h2>Sireno Music</h2>
</header>

<main id="main-container">
    <div class="content-wrapper" id="parallax-content">
        <div class="video-frame-container">
            <div class="video-frame-inner">
                <iframe src="https://www.youtube.com/embed/hTUsYpY1Fc0?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</main>

<script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    
    // Mouse Interaction Configuration
    const mouse = {
        x: null,
        y: null,
        radius: 180,
        active: false
    };

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
    });

    window.addEventListener('mouseleave', () => {
        mouse.active = false;
    });
    
    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        // High density particle texture
        const particleCount = Math.floor(width * height / 2200); 
        for(let i=0; i<particleCount; i++) {
            particles.push(new Particle());
        }
    }
    
    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.baseVx = (Math.random() - 0.5) * 1.8;
            this.baseVy = (Math.random() - 0.5) * 1.8;
            this.vx = this.baseVx;
            this.vy = this.baseVy;
            this.radius = Math.random() * 2.5 + 0.5;
            
            // Palette setup: Predominantly blues and purples, subtle orange and red bursts
            const rand = Math.random();
            if (rand < 0.45) this.baseColor = '#00D2FF';      // Cyan Blue
            else if (rand < 0.75) this.baseColor = '#0044FF'; // Deep Blue
            else if (rand < 0.90) this.baseColor = '#7F00FF'; // Purple
            else if (rand < 0.96) this.baseColor = '#FF5500'; // Orange Detail
            else this.baseColor = '#FF3333';                  // Red Touch
            
            this.color = this.baseColor;
            this.angle = Math.random() * Math.PI * 2;
            this.pulseSpeed = Math.random() * 0.08 + 0.04;
        }
        
        update() {
            // Mouse Reactivity (Psychedelic attraction/repulsion warp effect)
            if (mouse.active) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    // Create a swirl/pull effect around the cursor
                    const angle = Math.atan2(dy, dx) + Math.PI / 2; 
                    this.vx += Math.cos(angle) * force * 0.8 - (dx / distance) * force * 0.4;
                    this.vy += Math.sin(angle) * force * 0.8 - (dy / distance) * force * 0.4;
                    
                    // Shift colors under mouse influence to vibrant neon tones
                    if(this.baseColor === '#0044FF' || this.baseColor === '#00D2FF') {
                        this.color = '#7F00FF'; // Shift blues to purple
                    } else if (this.baseColor === '#7F00FF') {
                        this.color = '#FF5500'; // Shift purple to orange burst
                    }
                } else {
                    // Smoothly return to normal behavior
                    this.vx += (this.baseVx - this.vx) * 0.05;
                    this.vy += (this.baseVy - this.vy) * 0.05;
                    this.color = this.baseColor;
                }
            } else {
                this.vx += (this.baseVx - this.vx) * 0.05;
                this.vy += (this.baseVy - this.vy) * 0.05;
                this.color = this.baseColor;
            }

            // Speed limit to avoid chaotic escaping
            const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            if (speed > 4) {
                this.vx = (this.vx / speed) * 4;
                this.vy = (this.vy / speed) * 4;
            }

            this.x += this.vx;
            this.y += this.vy;
            this.angle += this.pulseSpeed;
            
            // Boundary wrap around
            if(this.x < 0) this.x = width;
            if(this.x > width) this.x = 0;
            if(this.y < 0) this.y = height;
            if(this.y > height) this.y = 0;
        }
        
        draw() {
            ctx.beginPath();
            const currentRadius = Math.abs(this.radius + Math.sin(this.angle) * 1.2);
            ctx.arc(this.x, this.y, currentRadius, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = mouse.active ? 12 : 6;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
    
    function animateBg() {
        // High trail effect for psychedelic motion blur
        ctx.fillStyle = 'rgba(5, 5, 21, 0.18)'; 
        ctx.fillRect(0, 0, width, height);
        
        for(let i=0; i<particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Interactive connection lines
            for(let j=i+1; j<particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist < 85) {
                    ctx.beginPath();
                    // Connect lines adapt dynamically to mouse presence
                    let alpha = (0.22 - dist/380);
                    if (mouse.active) {
                        const mDx = mouse.x - particles[i].x;
                        const mDy = mouse.y - particles[i].y;
                        if (Math.sqrt(mDx*mDx + mDy*mDy) < mouse.radius) {
                            alpha *= 2.2; // Intensify lines near cursor
                        }
                    }
                    ctx.strokeStyle = `rgba(0, 210, 255, ${alpha})`;
                    if (particles[i].color === '#FF5500' || particles[j].color === '#FF5500') {
                        ctx.strokeStyle = `rgba(255, 85, 0, ${alpha * 0.8})`;
                    }
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateBg);
    }
    
    window.addEventListener('resize', init);
    init();
    animateBg();
    
    // Smooth Content Parallax Interaction
    const main = document.getElementById('main-container');
    const content = document.getElementById('parallax-content');
    
    main.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 75; 
        const yAxis = (window.innerHeight / 2 - e.pageY) / 75;
        content.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
    
    main.addEventListener('mouseleave', () => {
        content.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
</script>
</body>
</html>
