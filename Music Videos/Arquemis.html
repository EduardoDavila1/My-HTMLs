<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquemis - Cuita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-dark: #050705;
            --text-light: #cccccc;
            --gothic-gold-muted: #736344;
            --gold-glow: rgba(192, 160, 96, 0.5); 
            --gold-glow-hover: rgba(220, 190, 130, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,1);
            z-index: 2;
            pointer-events: none;
        }

        main {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            perspective: 1500px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 2s ease-out;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--text-light);
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(200, 200, 200, 0.3);
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 14px;
            color: var(--gothic-gold-muted);
        }

        .video-wrapper {
            width: 100%;
            max-width: 880px;
            background: #000;
            border: 1px solid rgba(115, 99, 68, 0.2); 
            padding: 1px;
            transform-style: preserve-3d;
            
            /* Resplandor dorado atmosférico */
            box-shadow: 
                0 0 20px 2px var(--gold-glow),
                0 15px 60px 10px rgba(0, 0, 0, 0.8);
            
            transition: 
                transform 0.6s cubic-bezier(0.2, 1, 0.3, 1), 
                box-shadow 0.6s ease,
                border-color 0.6s ease;
            
            animation: slideUpWithGlow 2s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .video-wrapper:hover {
            border-color: rgba(192, 160, 96, 0.5);
            box-shadow: 
                0 0 40px 5px var(--gold-glow-hover),
                0 20px 80px 15px rgba(0, 0, 0, 0.9);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            filter: contrast(102%);
        }

        @keyframes fadeIn {
            0% { opacity: 0; filter: blur(8px); }
            100% { opacity: 1; filter: blur(0); }
        }

        @keyframes slideUpWithGlow {
            0% { 
                opacity: 0; 
                transform: translateY(40px) rotateX(12deg); 
                box-shadow: 0 0 0 0 rgba(0,0,0,0);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) rotateX(0deg); 
                box-shadow: 0 0 20px 2px var(--gold-glow), 0 15px 60px 10px rgba(0, 0, 0, 0.8);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; letter-spacing: 5px; }
            .subtitle { font-size: 1rem; letter-spacing: 10px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <main>
        <div class="header-container">
            <h1>ARQUEMIS</h1>
            <div class="subtitle">Cuita</div>
        </div>

        <div class="video-wrapper" id="videoWrapper">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/15ypZBAFDUw?autoplay=0&rel=0&modestbranding=1" 
                    title="Arquemis - Cuita" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </main>

    <script>
        /* ===================================================
           THREE.JS: FONDO CON BOSQUE Y MUCHAS PARTÍCULAS
           =================================================== */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        scene.background = new THREE.Color(0x030503);
        scene.fog = new THREE.FogExp2(0x030503, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Árboles (Sutiles)
        const treeGroup = new THREE.Group();
        const treeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x070c08, 
            wireframe: true,
            transparent: true,
            opacity: 0.06
        });

        for (let i = 0; i < 60; i++) {
            const height = Math.random() * 70 + 20;
            const geometry = new THREE.ConeGeometry(1.2, height, 3);
            const mesh = new THREE.Mesh(geometry, treeMaterial);
            mesh.position.set((Math.random() - 0.5) * 130, (Math.random() - 0.5) * 40 - 15, (Math.random() - 0.5) * 100);
            treeGroup.add(mesh);
        }
        scene.add(treeGroup);

        // ===================================================
        // AJUSTE DE PARTÍCULAS (MÁS CANTIDAD Y VISIBILIDAD)
        // ===================================================
        const particleCount = 1500; // AUMENTADO de 250 a 1500
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            // Dispersión ligeramente más amplia
            positions[i] = (Math.random() - 0.5) * 180;
            positions[i+1] = (Math.random() - 0.5) * 90;
            positions[i+2] = (Math.random() - 0.5) * 130;
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Textura de partícula más brillante y nítida
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 16; pCanvas.height = 16; // Canvas más grande para mejor definición
        const pCtx = pCanvas.getContext('2d');
        const grad = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        
        // Color más intenso (dorado pálido) y más opaco en el centro
        grad.addColorStop(0, 'rgba(230, 210, 170, 0.8)'); 
        grad.addColorStop(0.4, 'rgba(180, 160, 120, 0.3)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        pCtx.fillStyle = grad; pCtx.fillRect(0, 0, 16, 16);

        const particleMaterial = new THREE.PointsMaterial({
            size: 2.5, // AUMENTADO el tamaño para mayor visibilidad
            map: new THREE.CanvasTexture(pCanvas),
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.7, // AUMENTADA la opacidad general
            depthWrite: false
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // Interactividad del ratón
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.02;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.02;
        });

        // Bucle de renderizado
        function animate() {
            requestAnimationFrame(animate);
            // Árboles giran muy lento
            treeGroup.rotation.y += 0.0001;
            // Partículas giran un poco más rápido
            particleSystem.rotation.y += 0.0005;
            particleSystem.rotation.x += 0.0002;
            
            // Movimiento de cámara suave
            camera.position.x += (mouseX - camera.position.x) * 0.03;
            camera.position.y += (-mouseY - camera.position.y) * 0.03;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* ===================================================
           CSS PERSPECTIVE (INTERACCIÓN DEL VIDEO)
           =================================================== */
        const videoWrapper = document.getElementById('videoWrapper');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.clientX) / 80; 
            const yAxis = (window.innerHeight / 2 - e.clientY) / 80;
            videoWrapper.style.transform = `rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            videoWrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
